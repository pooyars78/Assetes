name: Build and publish Phoenix Installer
on:
  push:
    paths:
      - "PhoenixInstaller/**"
      - ".github/workflows/build-publish-installer.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build standalone installer
        shell: pwsh
        run: dotnet publish PhoenixInstaller/PhoenixInstaller.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Publish Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = "PhoenixInstaller/bin/Release/net8.0-windows/win-x64/publish/PhoenixInstaller.exe"
          if (!(Test-Path $exe)) { throw "Installer build output not found: $exe" }
          if ((Get-Item $exe).Length -lt 60000000) { throw "Installer output is unexpectedly small." }
          if (gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v1.0.0 $exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create v1.0.0 $exe --repo $env:GITHUB_REPOSITORY --title "Phoenix Installer v1.0.0" --notes "Phoenix MT5 standalone update installer, built from source in this repository."
          }
