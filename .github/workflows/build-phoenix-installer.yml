name: Build Phoenix Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "PhoenixInstaller/**"
      - ".github/workflows/build-phoenix-installer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish standalone Windows executable
        shell: pwsh
        run: |
          dotnet publish PhoenixInstaller/PhoenixInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o PhoenixInstaller/publish
          if (!(Test-Path "PhoenixInstaller/publish/PhoenixInstaller.exe")) {
            throw "PhoenixInstaller.exe was not produced."
          }
          Copy-Item "PhoenixInstaller/publish/PhoenixInstaller.exe" "PhoenixInstaller.exe" -Force
          $size = (Get-Item "PhoenixInstaller.exe").Length
          Write-Host "PhoenixInstaller.exe size: $size bytes"

      - name: Publish installer as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Phoenix Installer v1.0.0
          body: Phoenix MT5 standalone update installer.
          files: PhoenixInstaller.exe
          make_latest: true
          fail_on_unmatched_files: true
