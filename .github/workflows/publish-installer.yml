name: Publish Phoenix Installer

on:
  push:
    paths:
      - ".github/workflows/publish-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/pooyars78/MT5/raw/refs/heads/main/PhoenixInstaller/PhoenixInstaller.exe" -o PhoenixInstaller.exe
          echo "0529d4c22550635f1bf5e1c82029c034adff8e1e  PhoenixInstaller.exe" | sha1sum -c -

      - name: Create release and upload installer asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 PhoenixInstaller.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Phoenix Installer v1.0.0" \
            --notes "Phoenix MT5 installer. SHA-1 verified against the build stored in pooyars78/MT5."
