name: Publish Phoenix Installer
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify existing installer
        run: |
          set -euo pipefail
          curl -fL https://github.com/pooyars78/MT5/raw/refs/heads/main/PhoenixInstaller/PhoenixInstaller.exe -o PhoenixInstaller.exe
          echo '0529d4c22550635f1bf5e1c82029c034adff8e1e  PhoenixInstaller.exe' | sha1sum -c -
      - name: Upload installer to release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 PhoenixInstaller.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.0 PhoenixInstaller.exe --repo "$GITHUB_REPOSITORY" --title 'Phoenix Installer v1.0.0' --notes 'Phoenix MT5 installer'
          fi
